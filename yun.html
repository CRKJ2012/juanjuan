        function autoFillByPhone() {
            const phoneEl = document.getElementById('f_phone');
            if (!phoneEl) return;
            const phone = phoneEl.value.trim();
            const listEl = document.getElementById('history-order-list');
            if (!listEl) return;

            if (!phone) {
                listEl.style.display = 'none';
                return;
            }

            const retailTypes = ['retailOrder', 'retailSell', 'retailExchange', 'retailReturn'];
            let historyOrders = [];
            retailTypes.forEach(type => {
                const items = appData[type] || [];
                items.forEach(item => {
                    if (item.phone && item.phone.trim() === phone) {
                        historyOrders.push({ type: type, ...item });
                    }
                });
            });

            if (historyOrders.length === 0) {
                listEl.innerHTML = `<div class="history-empty">未找到该手机号的历史订单</div>`;
                listEl.style.display = 'block';
                return;
            }

            const seen = new Set();
            const unique = historyOrders.filter(item => {
                const key = item.order_no || item.customer + item.address;
                if (seen.has(key)) return false;
                seen.add(key);
                return true;
            });

            let html = '';
            unique.forEach((item, idx) => {
                const label =
                    `${item.order_no || '无单号'} | ${item.customer || '无姓名'} | ${item.address || '无地址'}`;
                html += `<div class="history-item" data-idx="${idx}">
                    <span class="h-label">📋</span> ${label}
                </div>`;
            });
            listEl.innerHTML = html;
            listEl.style.display = 'block';

            listEl.querySelectorAll('.history-item').forEach(el => {
                el.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.idx);
                    const selected = unique[idx];
                    if (selected) {
                        const customerEl = document.getElementById('f_customer');
                        if (customerEl) customerEl.value = selected.customer || '';
                        const addressEl = document.getElementById('f_address');
                        if (addressEl) addressEl.value = selected.address || '';
                        const brandEl = document.getElementById('f_brand');
                        if (brandEl && selected.brand) {
                            brandEl.value = selected.brand;
                            const evt = new Event('input');
                            brandEl.dispatchEvent(evt);
                        }
                        setTimeout(() => {
                            const nameEl = document.getElementById('f_goods_name');
                            if (nameEl && selected.goods_name) {
                                nameEl.value = selected.goods_name;
                                const evt = new Event('input');
                                nameEl.dispatchEvent(evt);
                            }
                        }, 100);
                        setTimeout(() => {
                            const modelEl = document.getElementById('f_model');
                            if (modelEl && selected.model) {
                                modelEl.value = selected.model;
                            }
                        }, 200);
                        const salesmanEl = document.getElementById('f_salesman');
                        if (salesmanEl && selected.salesman) {
                            salesmanEl.value = selected.salesman;
                        }
                        const warehouseEl = document.getElementById('f_warehouse');
                        if (warehouseEl && selected.warehouse) {
                            for (let i = 0; i < warehouseEl.options.length; i++) {
                                if (warehouseEl.options[i].value === selected.warehouse) {
                                    warehouseEl.selectedIndex = i;
                                    break;
                                }
                            }
                        }
                        listEl.style.display = 'none';
                    }
                });
            });
        }

        // ===================================================================
        // 库存更新
        // ===================================================================
        async function updateStock() {
            const stockMap = {};

            function getStockKey(item) {
                return item.model || '无型号';
            }

            (appData.purchaseIn || []).forEach(item => {
                const key = getStockKey(item);
                if (!stockMap[key]) {
                    stockMap[key] = {
                        brand: item.brand || '',
                        goods_name: item.goods_name || item.goodsName || '',
                        model: item.model || '',
                        warehouse: '全部',
                        book_stock: 0,
                        sales_order: 0
                    };
                }
                stockMap[key].book_stock += Number(item.quantity) || 0;
            });

            (appData.purchaseReturn || []).forEach(item => {
                const key = getStockKey(item);
                if (!stockMap[key]) {
                    stockMap[key] = {
                        brand: item.brand || '',
                        goods_name: item.goods_name || item.goodsName || '',
                        model: item.model || '',
                        warehouse: '全部',
                        book_stock: 0,
                        sales_order: 0
                    };
                }
                stockMap[key].book_stock -= Number(item.quantity) || 0;
            });

            (appData.retailReturn || []).forEach(item => {
                const key = getStockKey(item);
                if (!stockMap[key]) {
                    stockMap[key] = {
                        brand: item.brand || '',
                        goods_name: item.goods_name || item.goodsName || '',
                        model: item.model || '',
                        warehouse: '全部',
                        book_stock: 0,
                        sales_order: 0
                    };
                }
                stockMap[key].book_stock += 1;
            });

            (appData.sampleDisplay || []).forEach(item => {
                const key = getStockKey(item);
                if (!stockMap[key]) {
                    stockMap[key] = {
                        brand: item.brand || '',
                        goods_name: item.goods_name || item.goodsName || '',
                        model: item.model || '',
                        warehouse: '全部',
                        book_stock: 0,
                        sales_order: 0
                    };
                }
                stockMap[key].book_stock -= Number(item.quantity) || 0;
            });

            const orderTypes = ['retailOrder', 'retailSell'];
            orderTypes.forEach(type => {
                (appData[type] || []).forEach(item => {
                    const key = getStockKey(item);
                    if (!stockMap[key]) {
                        stockMap[key] = {
                            brand: item.brand || '',
                            goods_name: item.goods_name || item.goodsName || '',
                            model: item.model || '',
                            warehouse: '全部',
                            book_stock: 0,
                            sales_order: 0
                        };
                    }
                    stockMap[key].sales_order += 1;
                });
            });

            (appData.retailExchange || []).forEach(item => {
                const key = getStockKey(item);
                if (!stockMap[key]) {
                    stockMap[key] = {
                        brand: item.brand || '',
                        goods_name: item.goods_name || item.goodsName || '',
                        model: item.model || '',
                        warehouse: '全部',
                        book_stock: 0,
                        sales_order: 0
                    };
                }
                stockMap[key].sales_order += 1;
            });

            Object.values(stockMap).forEach(s => {
                s.available_stock = s.book_stock - s.sales_order;
            });

            const tableName = 'stock';
            await supabase.from(tableName).delete().eq('user_id', currentUserId);

            const records = Object.values(stockMap);
            if (records.length > 0) {
                const payloads = records.map(r => ({ ...r, user_id: currentUserId }));
                await supabase.from(tableName).insert(payloads);
            }

            const fresh = await fetchUserData(tableName);
            appData.stock = fresh || [];
        }

        function excelSerialToDate(serial) {
            if (typeof serial !== 'number' || serial < 0 || serial > 60000) return serial;
            let days = serial;
            if (serial >= 61) {
                days = serial - 1;
            }
            const epoch = new Date(1899, 11, 30);
            const date = new Date(epoch.getTime() + days * 86400000);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        async function handleFileImport(dataType) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const json = XLSX.utils.sheet_to_json(sheet);

                const cols = getTableColumns(dataType);
                const colMap = {};
                cols.forEach(c => colMap[c.label] = c.key);

                let dateFields = [];
                if (dataType === 'purchaseIn' || dataType === 'purchaseExchange' || dataType === 'purchaseReturn') {
                    dateFields = ['purchase_date', 'receive_date', 'invoice_date'];
                } else if (dataType === 'retailOrder' || dataType === 'retailSell' || dataType === 'retailExchange' ||
                    dataType === 'retailReturn') {
                    dateFields = ['order_date', 'install_date', 'sales_record_date', 'invoice_date', 'pos_date'];
                } else if (dataType === 'sampleDisplay') {
                    dateFields = ['display_date'];
                } else if (dataType === 'sampleSell') {
                    dateFields = ['order_date', 'install_date', 'sales_record_date', 'invoice_date'];
                }

                let imported = 0;
                const records = [];
                json.forEach(row => {
                    const mapped = {};
                    Object.keys(row).forEach(k => {
                        if (colMap[k]) mapped[colMap[k]] = row[k];
                    });

                    dateFields.forEach(field => {
                        if (mapped[field] !== undefined && mapped[field] !== null && mapped[field] !==
                            '') {
                            const val = mapped[field];
                            if (typeof val === 'number') {
                                mapped[field] = excelSerialToDate(val);
                            } else if (typeof val === 'string' && /^\d+$/.test(val.trim())) {
                                const num = parseInt(val.trim());
                                if (num > 0 && num < 60000) {
                                    mapped[field] = excelSerialToDate(num);
                                }
                            }
                        }
                    });

                    if (!mapped.order_no) {
                        const prefixMap = {
                            purchaseIn: 'RK-',
                            purchaseExchange: 'HH-',
                            purchaseReturn: 'TH-',
                            retailOrder: 'DD-',
                            retailSell: 'KD-',
                            retailExchange: 'ZH-',
                            retailReturn: 'TT-',
                            sampleDisplay: 'SY-',
                            sampleSell: 'YX-'
                        };
                        mapped.order_no = genOrderNo(prefixMap[dataType] || 'IM-', dataType);
                    }

                    if (mapped.quantity && mapped.price) mapped.amount = (parseFloat(mapped.quantity) * parseFloat(mapped
                        .price)).toFixed(2);
                    if (mapped.sell_price && mapped.retail_price) mapped.discount = (parseFloat(mapped.sell_price) /
                        parseFloat(mapped.retail_price)).toFixed(2);
                    if (mapped.sell_price && mapped.cost_price) mapped.profit = (parseFloat(mapped.sell_price) - parseFloat(
                        mapped.cost_price)).toFixed(2);

                    if (!mapped.warehouse) mapped.warehouse = '新库房';

                    records.push(mapped);
                    imported++;
                });

                if (records.length === 0) {
                    alert('没有有效数据可导入，请检查列名是否匹配');
                    event.target.value = '';
                    return;
                }

                try {
                    const tableName = getTableName(dataType);
                    await insertRecords(tableName, records);
                    const fresh = await fetchUserData(tableName);
                    appData[dataType] = fresh || [];
                    await updateStock();
                    renderTable(dataType);
                    alert(`成功导入 ${imported} 条记录`);
                } catch (err) {
                    alert('导入失败: ' + (err.message || '未知错误'));
                }
                event.target.value = '';
            };
            reader.readAsArrayBuffer(file);
            event.target.value = '';
        }

        // ===================================================================
        // 导出功能
        // ===================================================================
        function exportExcel(dataType) {
            showExportConfig(dataType);
        }

        function showExportConfig(dataType) {
            const cols = getTableColumns(dataType);
            if (!cols || cols.length === 0) {
                alert('该模块暂无导出配置');
                return;
            }

            let fieldHtml = '';
            cols.forEach((c) => {
                fieldHtml += `
                    <label>
                        <input type="checkbox" class="export-field-cb" data-key="${c.key}" value="${c.key}" checked>
                        ${c.label}
                    </label>
                `;
            });

            const modalBody = `
                <div style="margin-bottom:10px;">
                    <span style="font-weight:500;font-size:14px;">选择要导出的字段：</span>
                    <span class="select-all-link" onclick="toggleExportFields(true)">全选</span>
                    <span class="select-all-link" onclick="toggleExportFields(false)">取消全选</span>
                    <span class="field-count">已选 <span id="selected-count">${cols.length}</span> 个字段</span>
                </div>
                <div class="export-field-grid" id="export-field-grid">
                    ${fieldHtml}
                </div>
            `;

            document.getElementById('modal-title').textContent = '导出配置';
            document.getElementById('modal-body').innerHTML = modalBody;
            document.getElementById('modal-footer').innerHTML = `
                <button class="btn btn-default" onclick="closeModal()">取消</button>
                <button class="btn btn-success" onclick="generateExcel('${dataType}')">确认导出</button>
            `;
            document.getElementById('modal-mask').classList.add('show');

            document.querySelectorAll('.export-field-cb').forEach(cb => {
                cb.addEventListener('change', updateExportFieldCount);
            });
            updateExportFieldCount();
        }

        function updateExportFieldCount() {
            const checked = document.querySelectorAll('.export-field-cb:checked').length;
            const el = document.getElementById('selected-count');
            if (el) el.textContent = checked;
        }

        function toggleExportFields(selectAll) {
            document.querySelectorAll('.export-field-cb').forEach(cb => {
                cb.checked = selectAll;
            });
            updateExportFieldCount();
        }

        function generateExcel(dataType) {
            const cols = getTableColumns(dataType);
            let data = getFilteredData(dataType);

            const selectedKeys = [];
            document.querySelectorAll('.export-field-cb:checked').forEach(cb => {
                selectedKeys.push(cb.value);
            });

            if (selectedKeys.length === 0) {
                alert('请至少选择一个字段');
                return;
            }

            const selectedCols = cols.filter(c => selectedKeys.includes(c.key));

            const headerLabels = selectedCols.map(c => c.label);
            const excelData = [headerLabels];

            data.forEach(row => {
                const rowArr = selectedCols.map(c => {
                    let val = row[c.key];
                    if (val === undefined || val === null) val = '';
                    if (typeof val === 'number' && !Number.isInteger(val)) {
                        val = Number(val).toFixed(2);
                    }
                    return val;
                });
                excelData.push(rowArr);
            });

            const ws = XLSX.utils.aoa_to_sheet(excelData);
            const colWidths = headerLabels.map(() => ({ wch: 16 }));
            ws['!cols'] = colWidths;

            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, '汇总表');

            const titleMap = {
                purchaseIn: '采购入库汇总表',
                purchaseExchange: '采购换货汇总表',
                purchaseReturn: '采购退货汇总表',
                retailOrder: '零售订单汇总表',
                retailSell: '零售开单汇总表',
                retailExchange: '零售换货汇总表',
                retailReturn: '零售退货汇总表',
                stock: '库存日报表',
                sampleDisplay: '门店上样汇总表',
                sampleSell: '样机销售汇总表'
            };

            const fileName = `${titleMap[dataType] || '导出数据'}.xlsx`;
            XLSX.writeFile(wb, fileName);
            closeModal();
        }

        // ===================================================================
        // 初始化更新库存
        // ===================================================================
        (function() {
            const checkAndUpdate = setInterval(async () => {
                if (dataReady && currentUserId) {
                    clearInterval(checkAndUpdate);
                    await updateStock();
                    if (currentPage === 'stock-daily') {
                        renderTable('stock');
                    }
                }
            }, 500);
        })();

        // 暴露全局函数
        window.toggleMenu = toggleMenu;
        window.showPage = showPage;
        window.openAddForm = openAddForm;
        window.editRow = editRow;
        window.saveRow = saveRow;
        window.updateRow = updateRow;
        window.deleteRow = deleteRow;
        window.closeModal = closeModal;
        window.importExcel = importExcel;
        window.handleFileImport = handleFileImport;
        window.exportExcel = exportExcel;
        window.renderTable = renderTable;
        window.autoFillByPhone = autoFillByPhone;
        window.onBrandInput = onBrandInput;
        window.onNameInput = onNameInput;
        window.toggleExportFields = toggleExportFields;
        window.updateExportFieldCount = updateExportFieldCount;
        window.generateExcel = generateExcel;
        window.jumpToRetailByProduct = jumpToRetailByProduct;
        window.openBaseAddForm = openBaseAddForm;
        window.saveBaseRow = saveBaseRow;
        window.editBaseRow = editBaseRow;
        window.updateBaseRow = updateBaseRow;
        window.deleteBaseRow = deleteBaseRow;
        window.renderBaseTable = renderBaseTable;
        window.doLogin = doLogin;
        window.doRegister = doRegister;
        window.importBaseExcel = importBaseExcel;
        window.handleBaseFileImport = handleBaseFileImport;
        window.toggleRepeatFilter = toggleRepeatFilter;
        window.getFilteredData = getFilteredData;
        window.batchDelete = batchDelete;
        window.toggleAllCheckboxes = toggleAllCheckboxes;
        window.updateBatchDeleteBtn = updateBatchDeleteBtn;
        window.renderDashboard = renderDashboard;
        window.refreshDashboard = refreshDashboard;
        window.setDashboardRange = setDashboardRange;
        window.updateProfile = updateProfile;
        window.logout = logout;
        window.selectAvatarColor = selectAvatarColor;
        window.exportUserData = exportUserData;
        window.importUserData = importUserData;
        window.exportDashboardExcel = exportDashboardExcel;
        window.updateStock = updateStock;
        window.excelSerialToDate = excelSerialToDate;
        window.switchTab = switchTab;
    </script>
</body>
